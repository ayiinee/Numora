name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    env:
      TEACHER_TOKEN_PEPPER: fixture-only-teacher-token-pepper-not-for-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: numora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d numora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts
        run: pnpm test:checks && pnpm contracts:validate && pnpm contracts:types:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:test_only@localhost:5432/numora_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379
          DATABASE_MIGRATION_URL: postgres://postgres:test_only@localhost:5432/numora_test?sslmode=disable
        run: |
          pnpm --filter @tka/database db:migrate
          pnpm test
          pnpm --filter @tka/database db:upgrade-check
          pnpm --filter @tka/database db:staging:bridge-check

      - name: JOB-10 connected IRT foundation on one SHA
        env:
          TEST_DATABASE_URL: postgres://postgres:test_only@localhost:5432/numora_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379
        run: pnpm test:irt-chain

      - name: Upload JOB-10 connected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job10-connected-${{ github.sha }}
          path: .tmp/job10-evidence/connected.json
          if-no-files-found: warn

      - name: Install browser for E2E
        run: pnpm --filter @tka/web exec playwright install --with-deps chromium

      - name: Browser E2E
        env:
          DEBUG: pw:webserver
        run: pnpm --filter @tka/web test:e2e

      - name: Connected release chain (real API, PostgreSQL and Redis)
        env:
          PGPASSWORD: test_only
          TEST_DATABASE_URL: postgres://postgres:test_only@localhost:5432/numora_test_job06?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE numora_test_job06'
          pnpm test:release-chain

      - name: Upload sanitized release-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job06-connected-${{ github.sha }}
          path: .tmp/job06-evidence/connected.json
          if-no-files-found: warn

      - name: Build
        run: pnpm build

      - name: Check OpenAPI freshness
        run: |
          pnpm openapi:generate
          git diff --exit-code -- packages/contracts/openapi/openapi.json
